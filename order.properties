spring.application.name=order
server.port=8083

# Circuit Breaker configuration
resilience4j.circuitbreaker.instances.menuService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.menuService.slidingWindowSize=4
resilience4j.circuitbreaker.instances.menuService.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.menuService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.menuService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.menuService.permittedNumberOfCallsInHalfOpenState=2

# Expose Actuator endpoints for testing
management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents